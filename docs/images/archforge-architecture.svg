<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<rect width="1400" height="1190" fill="#f8fafc"/>
<text x="60" y="56" font-size="26" font-weight="700" fill="#0f172a">Archforge — how it works</text>
<text x="60" y="80" font-size="14" fill="#475569">An MCP server that your IDE’s AI chat uses to interview you, calculate capacity and write a full HLD + LLD</text>
<rect x="60" y="100" width="200" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="78" y="130" font-size="15" font-weight="700" fill="#0f172a">You</text>
<text x="78" y="154" font-size="13" fill="#334155">idea · answers</text>
<text x="78" y="148" font-size="12" fill="#334155"></text>
<rect x="300" y="96" width="1040" height="88" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="320" y="126" font-size="15" font-weight="700" fill="#0f172a">What is it — plugin, server or app?</text>
<text x="320" y="152" font-size="13" fill="#334155" text-anchor="start" font-weight="400">An MCP server: the standard “plugin” format for AI-capable IDEs. Your IDE starts it as a local process; the AI chat calls its tools.</text>
<text x="320" y="171" font-size="13" fill="#334155" text-anchor="start" font-weight="400">It is not a VS Code extension, not a web app and not a hosted service — no ports, no cloud; your data stays on your machine.</text>
<line x1="160" y1="172" x2="160" y2="208" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<circle cx="190" cy="190" r="12" fill="#0f172a"/>
<text x="190" y="195" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">①</text>
<text x="210" y="194" font-size="12" fill="#475569" text-anchor="start" font-weight="400">idea, answers, “confirm all”</text>
<rect x="60" y="210" width="1280" height="190" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="80" y="234" font-size="14" fill="#3730a3" text-anchor="start" font-weight="700">YOUR IDE  (the MCP client) — VS Code + Claude Code / Copilot · Cursor · Windsurf · JetBrains · Claude Desktop</text>
<rect x="90" y="250" width="380" height="130" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.6"/>
<text x="108" y="280" font-size="15" font-weight="700" fill="#0f172a">AI chat model</text>
<text x="108" y="304" font-size="13" fill="#334155">Claude, Copilot, GPT … whatever your IDE uses</text>
<text x="108" y="324" font-size="13" fill="#334155">Calls the tools, relays questions to you,</text>
<text x="108" y="344" font-size="13" fill="#334155">and writes sections in “host authoring” mode</text>
<rect x="500" y="250" width="380" height="130" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.6"/>
<text x="518" y="280" font-size="15" font-weight="700" fill="#0f172a">Popup forms  (MCP elicitation)</text>
<text x="518" y="304" font-size="13" fill="#334155">Native form per interview round, pre-filled</text>
<text x="518" y="324" font-size="13" fill="#334155">with defaults. If unsupported or declined,</text>
<text x="518" y="344" font-size="13" fill="#334155">questions are asked in chat instead.</text>
<rect x="910" y="250" width="400" height="130" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.6"/>
<text x="928" y="280" font-size="15" font-weight="700" fill="#0f172a">Workspace folder  (MCP roots)</text>
<text x="928" y="304" font-size="13" fill="#334155">The folder open in your IDE is where</text>
<text x="928" y="324" font-size="13" fill="#334155">docs/architecture/ gets written.</text>
<line x1="290" y1="400" x2="290" y2="440" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<circle cx="320" cy="420" r="12" fill="#0f172a"/>
<text x="320" y="425" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">②</text>
<text x="340" y="424" font-size="12" fill="#475569" text-anchor="start" font-weight="400">tool calls ⇄ results</text>
<line x1="690" y1="400" x2="690" y2="440" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="704" y="424" font-size="12" fill="#475569" text-anchor="start" font-weight="400">form request ⇄ your answers</text>
<line x1="1110" y1="400" x2="1110" y2="440" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="1124" y="424" font-size="12" fill="#475569" text-anchor="start" font-weight="400">workspace path</text>
<rect x="60" y="440" width="1280" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text x="700" y="462" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">MCP protocol — JSON-RPC over stdio</text>
<text x="700" y="481" font-size="12" fill="#92400e" text-anchor="middle" font-weight="400">Archforge runs as a local Node.js child process started by your IDE (command: node dist/index.js)</text>
<line x1="290" y1="492" x2="290" y2="520" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="690" y1="492" x2="690" y2="520" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="1110" y1="492" x2="1110" y2="520" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="60" y="520" width="1280" height="340" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="80" y="543" font-size="14" fill="#065f46" text-anchor="start" font-weight="700">ARCHFORGE MCP SERVER  (TypeScript / Node.js) — 9 tools + 1 prompt</text>
<rect x="90" y="560" width="380" height="115" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="136" y="590" font-size="15" font-weight="700" fill="#0f172a">Interview engine</text>
<text x="136" y="614" font-size="13" fill="#334155">25 questions + up to 8 follow-ups, 4 rounds</text>
<text x="136" y="634" font-size="13" fill="#334155">Follow-ups depend on earlier answers</text>
<text x="136" y="654" font-size="13" fill="#334155">Validates input; defaults become assumptions</text>
<circle cx="116" cy="586" r="12" fill="#0f172a"/>
<text x="116" y="591" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">③</text>
<rect x="510" y="560" width="380" height="115" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="556" y="590" font-size="15" font-weight="700" fill="#0f172a">Capacity calculator</text>
<text x="556" y="614" font-size="13" fill="#334155">Plain code, not an LLM: reproducible numbers</text>
<text x="556" y="634" font-size="13" fill="#334155">RPS · storage · instances · downtime budget</text>
<text x="556" y="654" font-size="13" fill="#334155">Warns on conflicts, e.g. 99.99% + tiny budget</text>
<circle cx="536" cy="586" r="12" fill="#0f172a"/>
<text x="536" y="591" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">④</text>
<rect x="930" y="560" width="380" height="115" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="976" y="590" font-size="15" font-weight="700" fill="#0f172a">Design generator</text>
<text x="976" y="614" font-size="13" fill="#334155">23 HLD + LLD section definitions</text>
<text x="976" y="634" font-size="13" fill="#334155">Builds context + prompt for each section</text>
<text x="976" y="654" font-size="13" fill="#334155">Marks sections stale if answers change</text>
<circle cx="956" cy="586" r="12" fill="#0f172a"/>
<text x="956" y="591" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑤</text>
<rect x="930" y="715" width="380" height="115" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="976" y="745" font-size="15" font-weight="700" fill="#0f172a">LLM router — who writes the text?</text>
<text x="976" y="769" font-size="13" fill="#334155">auto: own provider → IDE sampling → chat model</text>
<text x="976" y="789" font-size="13" fill="#334155">Switch any time with archforge_config</text>
<text x="976" y="809" font-size="13" fill="#334155">Same validation whichever one is used</text>
<circle cx="956" cy="741" r="12" fill="#0f172a"/>
<text x="956" y="746" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑥</text>
<rect x="510" y="715" width="380" height="115" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="556" y="745" font-size="15" font-weight="700" fill="#0f172a">Validator</text>
<text x="556" y="769" font-size="13" fill="#334155">Required diagrams present per section</text>
<text x="556" y="789" font-size="13" fill="#334155">Mermaid lint · placeholder check</text>
<text x="556" y="809" font-size="13" fill="#334155">Auto-repair retry (provider / sampling modes)</text>
<circle cx="536" cy="741" r="12" fill="#0f172a"/>
<text x="536" y="746" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑦</text>
<rect x="90" y="715" width="380" height="115" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="136" y="745" font-size="15" font-weight="700" fill="#0f172a">Exporter</text>
<text x="136" y="769" font-size="13" fill="#334155">hld.md · lld.md · README.md (assumptions)</text>
<text x="136" y="789" font-size="13" fill="#334155">viewer.html · diagrams/*.mmd</text>
<text x="136" y="809" font-size="13" fill="#334155">requirements.json</text>
<circle cx="116" cy="741" r="12" fill="#0f172a"/>
<text x="116" y="746" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑧</text>
<line x1="472" y1="617" x2="508" y2="617" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<line x1="892" y1="617" x2="928" y2="617" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<line x1="1120" y1="677" x2="1120" y2="713" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<line x1="928" y1="772" x2="892" y2="772" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<line x1="508" y1="772" x2="472" y2="772" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<rect x="90" y="900" width="380" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="108" y="930" font-size="15" font-weight="700" fill="#0f172a">Your workspace  (output)</text>
<text x="108" y="954" font-size="13" fill="#334155">docs/architecture/ hld.md, lld.md, README.md,</text>
<text x="108" y="974" font-size="13" fill="#334155">viewer.html, diagrams/*.mmd, requirements.json</text>
<rect x="510" y="900" width="380" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="528" y="930" font-size="15" font-weight="700" fill="#0f172a">Local state  (JSON files)</text>
<text x="528" y="954" font-size="13" fill="#334155">~/.archforge/projects/&lt;id&gt;.json — resume any time</text>
<text x="528" y="974" font-size="13" fill="#334155">~/.archforge/config.json — never stores API keys</text>
<rect x="930" y="900" width="380" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="948" y="930" font-size="15" font-weight="700" fill="#0f172a">Optional LLM providers</text>
<text x="948" y="954" font-size="13" fill="#334155">Claude API · Ollama (local) · OpenAI-compatible</text>
<text x="948" y="974" font-size="13" fill="#334155">API key is read from an env var, never saved</text>
<line x1="280" y1="830" x2="280" y2="900" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<text x="292" y="880" font-size="12" fill="#475569" text-anchor="start" font-weight="400">writes files</text>
<line x1="700" y1="830" x2="700" y2="900" stroke="#475569" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="712" y="880" font-size="12" fill="#475569" text-anchor="start" font-weight="400">saved after every step</text>
<line x1="1120" y1="830" x2="1120" y2="900" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="1132" y="880" font-size="12" fill="#475569" text-anchor="start" font-weight="400">HTTPS, only if configured</text>
<line x1="60" y1="1024" x2="1340" y2="1024" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="1048" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">THE FLOW, STEP BY STEP</text>
<text x="60" y="1074" font-size="13" fill="#334155" text-anchor="start" font-weight="400">①  You describe the idea in the chat.</text>
<text x="60" y="1100" font-size="13" fill="#334155" text-anchor="start" font-weight="400">②  The chat model calls Archforge’s tools over MCP.</text>
<text x="60" y="1126" font-size="13" fill="#334155" text-anchor="start" font-weight="400">③  Interview: popup forms (or chat questions) that adapt to your answers.</text>
<text x="60" y="1152" font-size="13" fill="#334155" text-anchor="start" font-weight="400">④  Capacity numbers are calculated by code, with warnings.</text>
<text x="710" y="1074" font-size="13" fill="#334155" text-anchor="start" font-weight="400">⑤  The generator prepares each section (context + instructions).</text>
<text x="710" y="1100" font-size="13" fill="#334155" text-anchor="start" font-weight="400">⑥  The router decides who writes it: your provider, IDE model or chat model.</text>
<text x="710" y="1126" font-size="13" fill="#334155" text-anchor="start" font-weight="400">⑦  The validator checks content and diagrams; failures are repaired.</text>
<text x="710" y="1152" font-size="13" fill="#334155" text-anchor="start" font-weight="400">⑧  The exporter writes the documents into your workspace folder.</text>
</svg>